<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Point de Capiton - Infinite Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #infinite-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        .video-loaded {
            opacity: 1 !important;
        }

        /* Hide all video controls */
        #infinite-video::-webkit-media-controls {
            display: none !important;
        }

        #infinite-video::-webkit-media-controls-panel {
            display: none !important;
        }

        #infinite-video::-webkit-media-controls-play-button {
            display: none !important;
        }

        #infinite-video::-webkit-media-controls-timeline {
            display: none !important;
        }

        #infinite-video::-webkit-media-controls-current-time-display {
            display: none !important;
        }

        #infinite-video::-webkit-media-controls-time-remaining-display {
            display: none !important;
        }

        #infinite-video::-webkit-media-controls-mute-button {
            display: none !important;
        }

        #infinite-video::-webkit-media-controls-volume-slider {
            display: none !important;
        }

        #infinite-video::-webkit-media-controls-fullscreen-button {
            display: none !important;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 18px;
            opacity: 1;
            transition: opacity 0.5s ease-in-out;
        }

        .loading.hidden {
            opacity: 0;
        }

        .error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 18px;
            text-align: center;
        }

        .error .subtitle {
            font-size: 14px;
            margin-top: 10px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <div class="video-wrapper">
            <video 
                id="infinite-video" 
                autoplay 
                muted 
                loop 
                playsinline
                preload="auto"
            >
                Your browser does not support the video tag.
            </video>
            <div class="loading" id="loading">Loading animation...</div>
            <div class="error hidden" id="error">
                <div>Animation unavailable</div>
                <div class="subtitle">Add video URL to environment variables</div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('infinite-video');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');

        // Get video URL from environment or use placeholder
        const videoUrl = window.location.search.includes('video=') 
            ? new URLSearchParams(window.location.search).get('video')
            : '/video.mp4';

        function showError() {
            loading.classList.add('hidden');
            error.classList.remove('hidden');
        }

        function showVideo() {
            loading.classList.add('hidden');
            video.classList.add('video-loaded');
        }

        function startPlayback() {
            video.currentTime = 0;
            video.play().catch(error => {
                console.error('Playback failed:', error);
                showError();
            });
        }

        function restartVideo() {
            video.currentTime = 0;
            video.play().catch(error => {
                console.error('Restart failed:', error);
                showError();
            });
        }

        // Event listeners
        video.addEventListener('loadeddata', () => {
            console.log('Video data loaded');
        });

        video.addEventListener('canplaythrough', () => {
            console.log('Video ready to play');
            showVideo();
            startPlayback();
        });

        video.addEventListener('error', (e) => {
            console.error('Video error:', e);
            showError();
        });

        video.addEventListener('ended', () => {
            console.log('Video ended, restarting...');
            restartVideo();
        });

        video.addEventListener('play', () => {
            console.log('Video started playing');
        });

        video.addEventListener('waiting', () => {
            console.log('Video buffering...');
        });

        video.addEventListener('playing', () => {
            console.log('Video is playing smoothly');
        });

        // Prevent interactions
        video.addEventListener('contextmenu', (e) => e.preventDefault());
        video.addEventListener('dragstart', (e) => e.preventDefault());
        video.addEventListener('selectstart', (e) => e.preventDefault());
        video.addEventListener('touchstart', (e) => e.preventDefault());
        video.addEventListener('touchmove', (e) => e.preventDefault());
        video.addEventListener('touchend', (e) => e.preventDefault());

        // Load video
        if (videoUrl && videoUrl !== '/video.mp4') {
            video.src = videoUrl;
            video.load();
        } else {
            showError();
        }

        // Prevent scrolling
        window.addEventListener('scroll', (e) => {
            e.preventDefault();
            window.scrollTo(0, 0);
        });

        // Prevent text selection
        document.addEventListener('selectstart', (e) => {
            e.preventDefault();
        });
    </script>
</body>
</html>
